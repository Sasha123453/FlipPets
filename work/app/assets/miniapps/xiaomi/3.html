// ===== 状态管理 =====
/* 卡片入场起始值。以前真机是 0（淡入 + 轻微放大），只有预览截图链路
   （scripts\shoot_preview.py 跑 Chrome headless，虚拟时间下 rAF 只回调两三次，
   cardEnterT 到不了 1）才通过 window.__DIAL_NO_ANIM 跳过动画直接从终态开始。
   真机的淡入过程中卡片处于半透明状态，一旦这几帧被系统丢帧（背屏渲染资源
   紧张时很常见，真机 bugreport 已实测复现），肉眼看到的就是半透明直接跳到
   全不透明 —— 卡片左上角那个用叠加发光混合模式画的高光（drawBronzeCard 的
   mTL）跳变最明显，就是"卡片一进来左上角闪一下"的根因。按钮当年是同样原因
   改成了常驻不透明（见「按钮常驻满不透明」那行），卡片本体现在同样处理：
   恒为 1，不再有半透明的中间帧，真机和预览走同一个终态，两条链路合一。
   注意所有重置 cardEnterT 的地方（drawCards / nextCard）都用这个值。 */
const ENTER_T0 = 1;
/* 预览样张要显示的单词，空串表示不固定（真机就是空串）。见 drawCards 里的用法。 */
const PREVIEW_WORD = (typeof window !== 'undefined' && window.__DIAL_NO_ANIM)
  ? (window.__DIAL_PREVIEW_WORD || 'passion') : '';
/* 描边加粗（strokeText+fillText）只在真机上做，预览渲染时跳过。
   预览图是 Windows 上 Chrome headless 渲染的，这台机器没有真正的 PingFang SC，
   会 fallback 到本身笔画就偏重的中文字体（实测比真机的 PingFang SC 明显粗）。
   真机「原生偏细字体 + 描边加粗」刚好是要的效果，但预览渲染时「本来就偏重的 fallback
   字体 + 同样的描边」两层叠加，看起来会比真机粗一圈——产品反馈过"预览图字体太粗"，
   根源是这个，不是描边宽度选错了。 */
const IS_PREVIEW = typeof window !== 'undefined' && window.__DIAL_NO_ANIM;
const state = {
  deck: [],
  cardIdx: 0,
  weights: {},
  /* 用普通对象而不是 Set：jsLite 的可用全局比浏览器窄，对象最稳（flashcard 早先也是为此改过）。
     键 = 词库下标，值恒 true。 */
  unknown: {},
  phase: 'card',
  hoverBtn: null,
  pressBtn: null,
  cardFlip: 0,
  showMeaning: false,
  totalSeen: 0,
  totalKnown: 0,
  cardEnterT: ENTER_T0,
  btnFeedback: {},
};

/* ========== 学习进度持久化 ==========
   产品要求保存历史记录。真机已验证 localStorage 能跨卡片重建保留（探针卡计数会累加）。
   存四样：词权重（不认识的下次更容易抽到，是核心学习状态）、不认识集合、
   累计统计、当前批次与进度（退出再进来能接着背，而不是重新抽一批）。
   任何一步失败都静默降级成「从零开始」—— 存档丢了顶多重新背，不能因此白屏。 */
const LS_KEY = 'flashcard_progress_v1';

function saveProgress() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      weights: state.weights,
      unknown: state.unknown,
      totalSeen: state.totalSeen,
      totalKnown: state.totalKnown,
      deck: state.deck,
      cardIdx: state.cardIdx,
      phase: state.phase,
      vocabLen: VOCAB.length,
    }));
  } catch (e) { /* 存不进去就算了，不影响本次使用 */ }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    /* 词库换版本后旧存档的下标会指到别的词上，直接丢弃重来 */
    if (!d || d.vocabLen !== VOCAB.length) return false;
    if (d.weights) state.weights = d.weights;
    if (d.unknown) state.unknown = d.unknown;
    state.totalSeen = d.totalSeen || 0;
    state.totalKnown = d.totalKnown || 0;
    if (Array.isArray(d.deck) && d.deck.length) {
      state.deck = d.deck;
      state.cardIdx = Math.min(d.cardIdx || 0, d.deck.length);
      state.phase = d.phase === 'done' ? 'done' : 'card';
    }
    return true;
  } catch (e) { return false; }
}

function initWeights() {
  VOCAB.forEach((_, i) => { state.weights[i] = 1; });
}

/* 一批的张数。产品定的是 20，但取 min(20, 词库长度) —— 词库小于 20 时
   抽不满却仍显示「x/20」，进度条永远到不了头、也进不了结算页。
   必须定义在 drawCards 之前：启动时 loadProgress 失败会立刻调 drawCards，
   const 有 TDZ，定义写在文件后面会直接 ReferenceError。 */
const BATCH = Math.min(20, VOCAB.length);

function drawCards() {
  const pool = VOCAB.map((_, i) => i);
  const totalW = pool.reduce((s, i) => s + (state.weights[i] || 1), 0);
  const drawn = [];
  const used = {};
  for (let n = 0; n < BATCH && pool.length > 0; n++) {
    let r = Math.random() * totalW;
    let chosen = -1;
    for (let i = 0; i < pool.length; i++) {
      const idx = pool[i];
      if (used[idx]) continue;
      r -= (state.weights[idx] || 1);
      if (r <= 0) { chosen = idx; break; }
    }
    if (chosen === -1) {
      for (let i = 0; i < pool.length; i++) {
        if (!used[pool[i]]) { chosen = pool[i]; break; }
      }
    }
    if (chosen >= 0) {
      drawn.push(chosen);
      used[chosen] = true;
    }
  }
  state.deck = drawn;
  /* 预览样张固定用同一个词：产品指定 passion。不固定的话每次重拍 preview 都换一个随机词，
     包体和图都跟着变，没法比对也没法沉淀成设计稿。只在预览渲染时生效（见 ENTER_T0 的注释），
     真机照旧加权随机抽。要换词不必改包，注入 window.__DIAL_PREVIEW_WORD 即可。 */
  if (PREVIEW_WORD) {
    const pi = VOCAB.findIndex((v) => v.w === PREVIEW_WORD);
    if (pi >= 0) state.deck = [pi].concat(drawn.filter((x) => x !== pi)).slice(0, BATCH);
  }
  state.cardIdx = 0;
  state.phase = 'card';
  state.showMeaning = false;
  state.cardFlip = 0;
  state.cardEnterT = ENTER_T0;
  /* 头部进度和结算页都是「本批」口径（prog = totalSeen/20，结算页读 totalKnown），
     换一批 / 再来一次都必须归零，否则第二批会显示 22/20 且新批第 1 张就写着已看 2 个。
     跨批要留的是 weights 和 unknown（喂给加权抽词），不是这两个计数。 */
  state.totalSeen = 0;
  state.totalKnown = 0;
}

initWeights();
/* 先读存档：命中就沿用上次的权重与批次进度（退出再进来能接着背），
   没有或词库版本变了就抽新的一批。 */
if (!loadProgress() || !state.deck.length) { drawCards(); }

// ===== 工具函数 =====
function radial(x0,y0,r0,x1,y1,r1,stops){
  const g=ctx.createRadialGradient(x0,y0,r0,x1,y1,r1);
  for(const[o,c]of stops)g.addColorStop(o,c);
  return g;
}
function roundRect(cx,cy,w,h,r){
  ctx.beginPath();
  ctx.moveTo(cx-w/2+r,cy-h/2);
  ctx.arcTo(cx+w/2,cy-h/2,cx+w/2,cy+h/2,r);
  ctx.arcTo(cx+w/2,cy+h/2,cx-w/2,cy+h/2,r);
  ctx.arcTo(cx-w/2,cy+h/2,cx-w/2,cy-h/2,r);
  ctx.arcTo(cx-w/2,cy-h/2,cx+w/2,cy-h/2,r);
  ctx.closePath();
}
function shade(hex,d){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+d, g=((n>>8)&255)+d, b=(n&255)+d;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function easeOut(t){ return 1-(1-t)*(1-t)*(1-t); }

/* 单行文本按可用宽度回缩字号，缩到底还超就截断加省略号。
   词库从 102 词换成 1948 词后，长单词（incomprehensible 在 60px 下约 528px，卡片才 516）
   和长释义（vt. 使…恶化，使…加重）都会画到卡片外面 —— 这两行都是单行绘制，没有换行。
   1948 条没法逐条人工核对，所以把保险放在渲染层：先按比例缩，最后兜底截断。
   fontTpl 里用 %d 占位字号，例：'700 %dpx "SF Pro Display",system-ui,sans-serif'。
   返回值里带 font，调用方拿去 ctx.font 赋值，避免这里改了外面又覆盖回去。 */
function fitText(text, fontTpl, basePx, minPx, maxW){
  const at = (px) => fontTpl.replace('%d', px);
  ctx.font = at(basePx);
  let w = ctx.measureText(text).width;
  if(w <= maxW) return { text, px: basePx, w, font: at(basePx) };
  let px = Math.max(minPx, Math.floor(basePx * maxW / w));
  ctx.font = at(px);
  w = ctx.measureText(text).width;
  if(w <= maxW) return { text, px, w, font: at(px) };
  let s = text;
  while(s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  s = s + '…';
  return { text: s, px, w: ctx.measureText(s).width, font: at(px) };
}

// 双箭头「换一批」图标：两段较长圆弧 + 较小箭头，两端留明显缺口、首尾不相接（复刻参考图标）
function drawSyncIcon(cx, cy, r, color){
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(2.4, r*0.34);
  ctx.lineCap = 'round';

  const GAP = Math.PI*0.16;   // 每端缺口约 29°：弧尾更长，但两弧仍有明显间距
  const AH = r*0.6;           // 箭头更小

  // 上弧：左侧 -> 顶 -> 右侧（顺时针），末端箭头指向下
  const topA0 = Math.PI + GAP;
  const topA1 = Math.PI*2 - GAP;
  ctx.beginPath();
  ctx.arc(cx, cy, r, topA0, topA1);
  ctx.stroke();
  let ex = cx + Math.cos(topA1)*r, ey = cy + Math.sin(topA1)*r;
  drawArrowHead(ex, ey, topA1 + Math.PI/2, AH);

  // 下弧：右侧 -> 底 -> 左侧（顺时针），末端箭头指向上
  const botA0 = GAP;
  const botA1 = Math.PI - GAP;
  ctx.beginPath();
  ctx.arc(cx, cy, r, botA0, botA1);
  ctx.stroke();
  ex = cx + Math.cos(botA1)*r; ey = cy + Math.sin(botA1)*r;
  drawArrowHead(ex, ey, botA1 + Math.PI/2, AH);

  ctx.restore();
}
// 在 (x,y) 处沿切线方向 ang 画一个实心三角箭头
function drawArrowHead(x, y, ang, size){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(size*0.62, 0);
  ctx.lineTo(-size*0.5, -size*0.55);
  ctx.lineTo(-size*0.5, size*0.55);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ===== update =====
function update(dt,t){
  state.cardEnterT = Math.min(1, state.cardEnterT + dt * 3);
  if(state.showMeaning){
    state.cardFlip = Math.min(1, state.cardFlip + dt * 4);
  } else {
    state.cardFlip = Math.max(0, state.cardFlip - dt * 4);
  }
  for(const k in state.btnFeedback){
    state.btnFeedback[k] = Math.max(0, state.btnFeedback[k] - dt * 4);
  }
}

/* 背景渐变缓存：W/H 运行时不变，渐变对象没必要每帧重建。
   canvas 引擎的 gradient cache 按 JS 对象引用识别，每帧 new 一个新渐变对象
   等于每帧 cache miss —— 这是"摇一摇背单词"在主题预览白屏、背屏闪烁的根因
   （真机 bugreport 里 15000+ 条 Frame dropped 定位到这里，2026-09）。
   下面 drawBronzeCard / themedButton 的渐变缓存是同一个问题的另外两处。 */
let _bgGradient = null;
function paintBg(t){
  if(!_bgGradient){
    _bgGradient = ctx.createLinearGradient(0,0,W,H);
    _bgGradient.addColorStop(0,'#020202');
    _bgGradient.addColorStop(1,'#724432');
  }
  ctx.fillStyle=_bgGradient;ctx.fillRect(0,0,W,H);
}

// ===== paintShapes =====
// 卡片与按钮的统一几何（paintShapes / paintText 共用）
/* 卡片宽度吃满可用区、左右各留 35 的呼吸位。原来 516 宽在 976 屏 651 的可用区里只占 79%，
   左右各空 67 —— 背屏离眼睛远，空着不如给字号。
   但不能写死 580：912 机型的可用区只有 608（CAM=304），写死会让右边只剩 14px、贴着屏幕边
   （预览图上很明显）。所以按可用区取小。
   976 屏：APP_W=651 → 580；912 屏：APP_W=608 → 538，两边都是左右各 35。
   垂直预算（H=596）：头行底边 96 | 间距 26 | 卡片 320（122..442）| 间距 26 | 按钮 76（468..544）| 底部 52。 */
const CARD = { x: CX, y: 288, w: Math.min(580, APP_W - 70), h: 320, r: 32 };
/* 卡内文字的可用宽度：左右各留 24 的呼吸位。单词和释义都按这个宽度回缩字号。 */
const INNER_W = CARD.w - 48;
/* 顶部标题/换一批那一行的底边，也是结果页等距布局的参考线。必须与 paintText 里的
   HEAD_BOTTOM 一致，不然结算页的「再来一轮」会和卡片页的按钮错开。 */
const DONE_TOP_REF = 102;
// 按钮宽度由卡片宽度决定：左右各占卡片一半、中间留 gap，两端顶格对齐卡片左右边
const BTN = { y: 512, h: 76, r: 38, gap: 40, get w(){ return (CARD.w - this.gap) / 2; } };
function knowBtnCenter(){ return { x: CARD.x + CARD.w/2 - BTN.w/2, y: BTN.y }; }  // 已学会（蓝，右）右顶格
function unkBtnCenter(){ return { x: CARD.x - CARD.w/2 + BTN.w/2, y: BTN.y }; }   // 不认识（橙，左）左顶格

// 青铜金属卡片（与背单词卡片完全一致的颜色与质感），可复用
/* 卡片渐变缓存：同一张卡在整个生命周期里位置/尺寸不变（卡内容换词不影响几何），
   4 个线性渐变 + 2 个径向渐变按 "cx,cy,w,h,r" 拼 key 缓存，命中就直接复用
   同一个 CanvasGradient 对象，不必每帧重新 createXxxGradient + addColorStop。 */
const _bronzeCardCache = {};
function drawBronzeCard(cx, cy, w, h, r){
  const Lx = cx-w/2, Ty = cy-h/2, Rx = cx+w/2, By = cy+h/2;
  const key = cx+','+cy+','+w+','+h+','+r;
  let gc = _bronzeCardCache[key];
  if(!gc){
    const cg = ctx.createLinearGradient(Lx, Ty, Rx, By);
    cg.addColorStop(0, 'rgba(118,90,64,0.82)');
    cg.addColorStop(0.5, 'rgba(92,68,50,0.80)');
    cg.addColorStop(1, 'rgba(60,44,34,0.84)');
    const inner = ctx.createLinearGradient(Lx, Ty, Rx, By);
    inner.addColorStop(0, 'rgba(196,166,128,0.22)');
    inner.addColorStop(0.45, 'rgba(120,94,70,0.04)');
    inner.addColorStop(1, 'rgba(48,34,26,0.38)');
    const hl = ctx.createLinearGradient(0, Ty, 0, cy);
    hl.addColorStop(0, 'rgba(255,240,214,0.14)');
    hl.addColorStop(1, 'rgba(255,236,210,0)');
    const mTL = radial(Lx, Ty, 4, Lx, Ty, w*0.66, [
      [0, 'rgba(248,220,180,0.40)'],[0.32, 'rgba(210,176,130,0.16)'],[1, 'rgba(210,176,130,0)']
    ]);
    const mBR = radial(Rx, By, 4, Rx, By, w*0.66, [
      [0, 'rgba(240,206,160,0.30)'],[0.4, 'rgba(188,142,96,0.14)'],[1, 'rgba(188,142,96,0)']
    ]);
    const edge = ctx.createLinearGradient(Lx, Ty, Rx, By);
    edge.addColorStop(0, 'rgba(255,240,208,0.78)');
    edge.addColorStop(0.3, 'rgba(180,150,116,0.28)');
    edge.addColorStop(0.5, 'rgba(120,96,74,0.20)');
    edge.addColorStop(0.72, 'rgba(180,150,116,0.30)');
    edge.addColorStop(1, 'rgba(255,232,196,0.70)');
    gc = _bronzeCardCache[key] = { cg, inner, hl, mTL, mBR, edge };
  }

  ctx.save();
  // 卡片投影
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 46; ctx.shadowOffsetY = 22;
  ctx.fillStyle = gc.cg;
  roundRect(cx, cy, w, h, r);
  ctx.fill();
  ctx.shadowColor = 'transparent';

  ctx.save();
  roundRect(cx, cy, w, h, r);
  ctx.clip();
  ctx.fillStyle = gc.inner;
  ctx.fillRect(Lx, Ty, w, h);
  ctx.fillStyle = gc.hl;
  ctx.fillRect(Lx, Ty, w, h*0.55);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = gc.mTL; ctx.fillRect(Lx, Ty, w, h);
  ctx.fillStyle = gc.mBR; ctx.fillRect(Lx, Ty, w, h);
  ctx.restore();
  ctx.restore();

  // 金属描边
  ctx.lineWidth = 2;
  ctx.strokeStyle = gc.edge;
  roundRect(cx, cy, w, h, r);
  ctx.stroke();
  ctx.restore();
}

/* 按钮渐变缓存：同一个按钮的 cx,cy,w,h,c1,c2,hover 组合对应固定的渐变，
   hover 态单独进 key（发光强度已经用 shadowBlur 实时算，不进缓存）。 */
const _themedBtnCache = {};
// 橙/蓝/金渐变胶囊按钮（结算页的「再来一轮」也走这里，原来那个深黑金属底 + 金描边的
// goldButton 已经删掉 —— 设计要求三个按钮同一种风格）
function themedButton(cx,cy,w,h,r,c1,c2,glow,hover,press,fb){
  const oy = press ? 2 : 0;
  const key = cx+','+cy+','+w+','+c1+','+c2+','+hover;
  let g = _themedBtnCache[key];
  if(!g){
    g = ctx.createLinearGradient(cx-w/2, cy, cx+w/2, cy);
    g.addColorStop(0, hover?shade(c1,10):c1);
    g.addColorStop(1, hover?shade(c2,10):c2);
    _themedBtnCache[key] = g;
  }
  ctx.save();
  ctx.shadowColor = glow;
  ctx.shadowBlur = (hover?26:18) + (fb||0)*18;
  ctx.shadowOffsetY = 6;
  ctx.fillStyle = g;
  roundRect(cx, cy+oy, w, h, r);
  ctx.fill();
  ctx.restore();
}

function paintShapes(t){
  const cardAreaX = CARD.x;
  const cardAreaY = CARD.y;
  const cardW = CARD.w;
  const cardH = CARD.h;

  if(state.phase === 'card'){
    const idx = state.deck[state.cardIdx];
    if(idx === undefined) return;
    const entry = easeOut(state.cardEnterT);

    ctx.save();
    ctx.globalAlpha = entry;
    const scale = 0.94 + 0.06 * entry;
    ctx.translate(cardAreaX, cardAreaY);
    ctx.scale(scale, scale);
    ctx.translate(-cardAreaX, -cardAreaY);

    const flip = state.cardFlip;
    const scaleX = Math.abs(Math.cos(flip * Math.PI));
    if(scaleX < 0.02) { ctx.restore(); }
    else {
      ctx.translate(cardAreaX, cardAreaY);
      ctx.scale(scaleX, 1);
      ctx.translate(-cardAreaX, -cardAreaY);

      /* 卡面与结算页共用同一份「青铜金属卡」绘制 + 渐变缓存，见 drawBronzeCard。
         原来这里整段复制了一份几乎一样的渲染代码、且渐变每帧重建 —— 是本卡
         白屏/闪烁问题的主因（drawBronzeCard 的注释有完整背景）。 */
      drawBronzeCard(cardAreaX, cardAreaY, cardW, cardH, CARD.r);

      ctx.restore();
    }

    // ===== 两个按钮：不认识（橙，左）/ 已学会（蓝，右）=====
    const kb = knowBtnCenter(), ub = unkBtnCenter();
    addHit(ub.x - BTN.w/2, ub.y - BTN.h/2, BTN.w, BTN.h, 'unknown');
    addHit(kb.x - BTN.w/2, kb.y - BTN.h/2, BTN.w, BTN.h, 'know');

    // 按钮常驻满不透明（不随卡片淡入动画闪烁）
    themedButton(ub.x, ub.y, BTN.w, BTN.h, BTN.r, ORG1, ORG2, 'rgba(245,96,26,0.5)',
      state.hoverBtn==='unknown', state.pressBtn==='unknown', 0);
    themedButton(kb.x, kb.y, BTN.w, BTN.h, BTN.r, BLU1, BLU2, 'rgba(47,134,240,0.5)',
      state.hoverBtn==='know', state.pressBtn==='know', 0);

  } else if(state.phase === 'done'){
    const entry = easeOut(Math.min(1, state.cardEnterT));

    // 结果卡片：与背单词卡片完全一致的青铜金属质感，同样几何
    ctx.save();
    ctx.globalAlpha = entry;
    ctx.translate(CARD.x, CARD.y);
    const sc = 0.94 + 0.06 * entry;
    ctx.scale(sc, sc);
    ctx.translate(-CARD.x, -CARD.y);
    drawBronzeCard(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r);
    ctx.restore();

    // 黑金「再来一轮」按钮：到卡片的距离 = 卡片到顶部组件的距离
    const cardTop = CARD.y - CARD.h/2;
    const cardBottom = CARD.y + CARD.h/2;
    const topGap = cardTop - DONE_TOP_REF;          // 卡片顶到顶部组件底的间距
    // 高度与卡片页的两个按钮一致：这样两页切换时按钮中心落在同一条线上，不会上下跳
    const rbtnW = 230, rbtnH = BTN.h, rbtnR = BTN.h / 2;
    const retryBtnY = cardBottom + topGap + rbtnH/2;
    addHit(CX - rbtnW/2, retryBtnY - rbtnH/2, rbtnW, rbtnH, 'retry');
    /* 与卡片页那两个按钮同一种做法（实心横向渐变 + 同色发光），颜色走金色系。
       原来是深黑金属底 + 金色描边，跟前一页的实心按钮不是一路风格，设计要求统一。 */
    themedButton(CX, retryBtnY, rbtnW, rbtnH, rbtnR, GLD1, GLD2, 'rgba(226,168,74,0.5)',
      state.hoverBtn === 'retry', state.pressBtn === 'retry', 0);
    state._retryBtnY = retryBtnY;   // 供文字层使用
  }
}

// ===== paintText =====
function paintText(t){
  if(state.phase === 'card'){
    const idx = state.deck[state.cardIdx];
    if(idx === undefined) return;
    const entry = easeOut(state.cardEnterT);
    const word = VOCAB[idx];
    const cardAreaX = CARD.x, cardAreaY = CARD.y;
    const flip = state.cardFlip;

    ctx.save();
    ctx.globalAlpha = entry;

    const scaleX = Math.abs(Math.cos(flip * Math.PI));
    if(scaleX > 0.08){
      ctx.save();
      ctx.translate(cardAreaX, cardAreaY);
      ctx.scale(scaleX, 1);
      ctx.translate(-cardAreaX, -cardAreaY);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const ipaTxt = word.p || '';
      /* 音标独占一行，不跟词性/释义挤在一排。
         六级500 里最长音标 /dɪˌtɜːmɪˈneɪʃən/ 在 22px 下约 230px，最长释义 16 个中文字约 416px，
         再加词性和段间距一行要 690px，卡内可用宽只有 468 —— 三段同排必然把释义压到 18px 以下。 */
      if(flip < 0.5){
        // 正面：单词（白，大）/ 音标（暖灰）/ 一行「词性 + 释义」
        // 单词：60px 起，长单词自动回缩（见 fitText 注释）
        const wordFit = fitText(word.w,
          '700 %dpx "SF Pro Display",-apple-system,system-ui,sans-serif', 68, 40, INNER_W);
        ctx.fillStyle = INK;
        ctx.font = wordFit.font;
        ctx.fillText(wordFit.text, cardAreaX, cardAreaY - (ipaTxt ? 66 : 34));

        if(ipaTxt){
          const ipaFit = fitText(ipaTxt,
            '400 %dpx "SF Pro Text",-apple-system,system-ui,sans-serif', 38, 20, INNER_W);
          ctx.fillStyle = SUB;
          ctx.font = ipaFit.font;
          ctx.fillText(ipaFit.text, cardAreaX, cardAreaY + 12);
        }

        /* 词性（暖色）| 释义（灰），整行居中：先量总宽再定起点，少一段不用改逻辑。
           词性很短（adj./v./n.）不回缩，可用宽度先扣掉它，剩下的都给释义。
           一词多词性的（v. 撤销；adj. 反面的）导入时就不剥前缀，POS 查不到、整条走释义。 */
        const posTxt = POS[word.w] || '';
        const lineY = cardAreaY + (ipaTxt ? 78 : 46);
        /* 音标 38 / 词性 40 / 释义 44，都压在单词 68 以下（产品要求：放大但不抢单词）。
           长释义超宽由 fitText 回缩兜底：16 个中文字在 44px 下要 704px，卡内只有 532，
           会自动缩到 33px 左右；短释义才吃满 44px。 */
        const fPos = 'italic 600 40px "SF Pro Display",-apple-system,system-ui,sans-serif';
        const seg = 18; // 段间距
        ctx.font = fPos; const wPos = posTxt ? ctx.measureText(posTxt).width : 0;
        const cnFit = fitText(word.c,
          '400 %dpx "PingFang SC",-apple-system,system-ui,sans-serif',
          44, 24, INNER_W - (posTxt ? wPos + seg : 0));
        const totalW = (posTxt ? wPos + seg : 0) + cnFit.w;
        let sx = cardAreaX - totalW/2;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        if(posTxt){ ctx.fillStyle = '#ffcf8f'; ctx.font = fPos; ctx.fillText(posTxt, sx, lineY); sx += wPos + seg; }
        ctx.fillStyle = 'rgba(235,225,210,0.82)'; ctx.font = cnFit.font; ctx.fillText(cnFit.text, sx, lineY);
        ctx.textAlign = 'center';
      } else {
        // 背面：释义（白，大）/ 单词（暖灰）/ 音标（暖灰，更小）；同样按宽度回缩
        const bCn = fitText(word.c,
          '600 %dpx "PingFang SC","SF Pro Display",-apple-system,system-ui,sans-serif',
          48, 26, INNER_W);
        ctx.fillStyle = INK;
        ctx.font = bCn.font;
        ctx.fillText(bCn.text, cardAreaX, cardAreaY - (ipaTxt ? 46 : 22));

        const bW = fitText(word.w,
          '400 %dpx "SF Pro Display",-apple-system,system-ui,sans-serif', 36, 22, INNER_W);
        ctx.fillStyle = SUB;
        ctx.font = bW.font;
        ctx.fillText(bW.text, cardAreaX, cardAreaY + (ipaTxt ? 28 : 60));

        if(ipaTxt){
          const bIpa = fitText(ipaTxt,
            '400 %dpx "SF Pro Text",-apple-system,system-ui,sans-serif', 32, 20, INNER_W);
          ctx.fillStyle = 'rgba(235,225,210,0.46)';
          ctx.font = bIpa.font;
          ctx.fillText(bIpa.text, cardAreaX, cardAreaY + 82);
        }
      }
      ctx.restore();
    }

    // 按钮文字：不认识（左）/ 已学会（右）—— 常驻满不透明，不随卡片淡入
    const kb = knowBtnCenter(), ub = unkBtnCenter();
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 36px "PingFang SC",-apple-system,system-ui,sans-serif';
    const uoy = state.pressBtn==='unknown'?2:0, koy = state.pressBtn==='know'?2:0;
    ctx.fillText(T.unknown, ub.x, ub.y + 1 + uoy);
    ctx.fillText(T.know, kb.x, kb.y + 1 + koy);

    ctx.restore();

  } else if(state.phase === 'done'){
    const entry = easeOut(Math.min(1, state.cardEnterT));
    ctx.save();
    ctx.globalAlpha = entry;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 卡片内文字：三行整体在卡片内垂直居中（卡片中心 CARD.y）
    const midY = CARD.y;
    ctx.fillStyle = INK;
    /* 字号粗细跟卡片正面对齐（设计要求「和之前统一」，原来 44/600 + 36/500 明显偏小）：
       「本轮完成」用 56px 700，对应正面单词那一档的重量；两行统计用 44px 400，
       与正面释义完全一致。三行等间距 16，整体在卡片内垂直居中（上下各留 72）。 */
    ctx.font = '700 56px "PingFang SC",-apple-system,system-ui,sans-serif';
    ctx.fillText(T.doneTitle, CARD.x, midY - 60);

    ctx.font = '400 44px "PingFang SC",-apple-system,system-ui,sans-serif';
    ctx.fillStyle = '#6bd39a';
    ctx.fillText(T.knowPrefix + state.totalKnown + T.countSuffix, CARD.x, midY + 6);

    ctx.fillStyle = '#f0889f';
    ctx.fillText(T.unknownPrefix + (state.totalSeen - state.totalKnown) + T.countSuffix, CARD.x, midY + 66);
    ctx.restore();

    // 黑金按钮文字：再来一轮（常驻满不透明，金色）
    const rby = state._retryBtnY || 430;
    const roy = state.pressBtn === 'retry' ? 2 : 0;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 与卡片页的「不认识 / 已学会」同字号同粗细（设计要求按钮风格统一）
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 36px "PingFang SC",-apple-system,system-ui,sans-serif';
    ctx.fillText(T.retry, CX, rby + 1 + roy);
    ctx.restore();
  }

  // 顶部标题：居中「背单词」+ 右侧「循环按钮 + 换一批」
  ctx.save();
  ctx.textBaseline = 'middle';
  const hy = 68;
  /* 标题字号：设计要求「大到碰到下面的灰块」，也就是墨迹底边与换一批胶囊的底边齐平。
     胶囊高 56（45..102），汉字墨迹高约等于字号的 0.9，所以 60px 的墨迹正好铺满这个高度。 */
  const title = T.title;
  const TITLE_PX = 60;
  /* 字重用 700，不用 800：PingFang SC 没有真正的 800 字重，系统会用「合成粗体」
     （在 700 的字形基础上二次描边加粗）去凑，笔画厚度不均匀，字号一大就很明显——
     产品反馈"背单词"和其他文字（按钮、结算页）粗细不一致，根源就是这个。
     全卡所有粗体文字统一用 700，没有例外。 */
  ctx.font = `700 ${TITLE_PX}px "PingFang SC",-apple-system,system-ui,sans-serif`;
  const titleW = ctx.measureText(title).width;

  // 换一批按钮尺寸计算（图标 + 文字）
  const rbTxt = T.redraw;
  ctx.font = '600 28px "PingFang SC",-apple-system,system-ui,sans-serif';
  const rbTxtW = ctx.measureText(rbTxt).width;
  const rbIcon = 28;          // 循环图标直径
  const rbInnerGap = 12;      // 图标与文字间距
  const rbPadX = 24;          // 胶囊左右内边距
  const rbW = rbPadX*2 + rbIcon + rbInnerGap + rbTxtW;
  const rbH = 56;

  // 定格对齐卡片左右边缘
  const cardLeft = CARD.x - CARD.w/2;
  const cardRight = CARD.x + CARD.w/2;

  /* 这一排（标题 48px / 进度 30px / 换一批胶囊 56px）按「视觉中线」对齐，不是底边对齐。
     原来三者都对齐 HEAD_BOTTOM，底边确实齐（实测都在 y=102），但三个元素高度不同，
     视觉重心就散了 —— 量过：标题中心 79.5、进度中心 89.5、胶囊中心 73.5，差 16px，
     产品看到的就是这个「没对齐」。
     现在统一用 textBaseline='middle' 对同一条中线：middle 基线就是字形的 em box 中心，
     比 alphabetic 再手工加减偏移（之前进度那行还额外 +3）可靠得多，换字号也不用重调。 */
  const HEAD_BOTTOM = DONE_TOP_REF;       // 该行底边（换一批胶囊的盒底，也是结果页的参考线）
  const HEAD_MID = HEAD_BOTTOM - rbH / 2; // 该行视觉中线 = 胶囊垂直中心
  /* 竖向定位都用 textBaseline='middle' 再加一个「墨迹补偿」：middle 基线取的是 em box 中心，
     而 em box 上下留着西文升部/降部的空间，汉字和数字的实际墨迹在里面偏上，直接用 middle
     会整体偏高。

     补偿值必须用真机截图量（.aicard/_measure-head.py），不能只信预览渲染——踩过一次：
     之前的 6/2 是照预览图（Windows headless，字体是 fallback 出来的）校准的，真机
     （PingFang SC）上量出来标题底边偏低 6px、进度中心偏低 3.5px，两条硬指标都没达标。
     Canvas2D 的 textBaseline='middle' 定位是严格平移不变的——同一段文字，fillText 的
     y 坐标改多少，渲染出来的墨迹就整体平移多少，不受字体度量影响，所以能直接拿真机
     误差反推新值，不用再去猜字体比例系数：
       标题：真机测得底边 108，要贴到 HEAD_BOTTOM=102，上移 6px -> DY 从 6 降到 0
       进度：真机测得中心 76.5，要和标题新中心（79-6=73）对齐，上移 3.5px -> DY 从 2 降到 -1.5

     设计给的两条硬要求：标题墨迹底边贴住胶囊底边（HEAD_BOTTOM）、进度垂直居中于标题。
     所以先算出标题的墨迹中线，再让两者都挂在这条线上 —— 别各自去凑 HEAD_MID，
     那样改字号就得两处一起重调。汉字墨迹高约等于字号的 0.93（仅用来估中线，不影响
     上面这两个已用真机数据校准过的偏移量）。 */
  const TITLE_INK_MID = HEAD_BOTTOM - TITLE_PX * 0.93 / 2;
  const TITLE_INK_DY = 0;     // 标题：真机实测校准（2026-09 三轮 60px+描边版）
  const PROG_INK_DY = -1.5;   // 进度：同上

  // 标题：左边缘对齐卡片左边，墨迹底边与换一批胶囊底边齐平
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${TITLE_PX}px "PingFang SC",-apple-system,system-ui,sans-serif`;
  /* 描边加粗：CSS font-weight 700 在部分中文字体上笔画偏细（跟本仓库番茄钟 timeStr、
     今天吃啥盲盒 state.text 的做法一致——那两处也是 strokeText+fillText 而不是单纯
     指望字体自带粗字重）。线宽取字号的 1/20（60px -> 3px）：产品反馈 1/12（5px）太粗，
     按参考图核对后收窄到这个比例，笔画比原生 700 明显扎实，但不会糊掉「囗」「言」
     这类字里的窄缝。lineJoin 用 round 避免转角处尖刺，颜色和填充同色，
     纯粹是为了物理加宽笔画，不是描边效果。 */
  ctx.lineJoin = 'round';
  if (!IS_PREVIEW) {
    ctx.lineWidth = TITLE_PX / 20;
    ctx.strokeStyle = '#ffffff';
    ctx.strokeText(title, cardLeft, TITLE_INK_MID + TITLE_INK_DY);
  }
  ctx.fillStyle = '#ffffff';
  ctx.fillText(title, cardLeft, TITLE_INK_MID + TITLE_INK_DY);

  // 背单词进度「x/20」——紧跟标题右侧，垂直居中于标题（挂同一条墨迹中线）
  // 描边加粗，比例和标题一致（字号/20），产品反馈这行和「换一批」也偏细
  const prog = state.totalSeen + '/' + TOTAL;
  const progFont = '600 30px "SF Pro Display","PingFang SC",-apple-system,system-ui,sans-serif';
  const progX = cardLeft + titleW + 20, progY = TITLE_INK_MID + PROG_INK_DY;
  ctx.font = progFont;
  ctx.lineJoin = 'round';
  if (!IS_PREVIEW) {
    ctx.lineWidth = 30 / 20;
    ctx.strokeStyle = SUB;
    ctx.strokeText(prog, progX, progY);
  }
  ctx.fillStyle = SUB;
  ctx.fillText(prog, progX, progY);

  // 换一批按钮（胶囊）：右边缘对齐卡片右边，垂直中心就是 HEAD_MID
  const rbCx = cardRight - rbW/2;
  const rbCy = HEAD_MID;
  const rbHover = state.hoverBtn==='redraw', rbPress = state.pressBtn==='redraw';
  addHit(rbCx - rbW/2, rbCy - rbH/2, rbW, rbH, 'redraw');
  const rboy = rbPress ? 1 : 0;
  ctx.save();
  roundRect(rbCx, rbCy + rboy, rbW, rbH, rbH/2);
  ctx.fillStyle = rbHover ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.12)';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255,236,210,0.5)';
  ctx.stroke();
  ctx.restore();

  // 循环（双箭头刷新）图标 —— 两段粗圆弧 + 三角箭头
  const icx = rbCx - rbW/2 + rbPadX + rbIcon/2;
  const icy = rbCy + rboy;
  const ir = rbIcon/2 - 2.5;
  drawSyncIcon(icx, icy, ir, '#ffe8c4');

  // 换一批文字：描边加粗，比例和标题一致（字号/20）
  ctx.textAlign = 'left';
  ctx.font = '600 28px "PingFang SC",-apple-system,system-ui,sans-serif';
  const rbTxX = icx + rbIcon/2 + rbInnerGap, rbTxY = rbCy + rboy + 1;
  ctx.lineJoin = 'round';
  if (!IS_PREVIEW) {
    ctx.lineWidth = 28 / 20;
    ctx.strokeStyle = '#ffe8c4';
    ctx.strokeText(rbTxt, rbTxX, rbTxY);
  }
  ctx.fillStyle = '#ffe8c4';
  ctx.fillText(rbTxt, rbTxX, rbTxY);
  ctx.restore();
}

// ===== 交互 =====
function onTap(id){
  /* 每次交互后落盘：这些操作都在改学习状态（权重、不认识集合、进度），
     背屏卡片随时可能被回收，不能等"退出"再存 —— 压根没有退出事件。 */
  setTimeout(saveProgress, 0);
  if(id === 'know'){
    const idx = state.deck[state.cardIdx];
    state.totalSeen++;
    state.totalKnown++;
    state.weights[idx] = Math.max(0.3, (state.weights[idx] || 1) * 0.7);
    delete state.unknown[idx];
    state.btnFeedback['know'] = 1;
    nextCard();
  } else if(id === 'unknown'){
    const idx = state.deck[state.cardIdx];
    state.totalSeen++;
    state.unknown[idx] = true;
    state.weights[idx] = (state.weights[idx] || 1) * 2.5;
    state.btnFeedback['unknown'] = 1;
    nextCard();
  } else if(id === 'retry' || id === 'redraw'){
    drawCards();
  }
}

function nextCard(){
  state.cardIdx++;
  state.showMeaning = false;
  state.cardFlip = 0;
  state.cardEnterT = ENTER_T0;
  if(state.cardIdx >= BATCH){
    state.phase = 'done';
    state.cardEnterT = ENTER_T0;
  }
}

// ===== 骨架集成 =====
if(typeof data==='undefined'){const D=()=>new Date();window.data={
 get hour24(){return D().getHours()},get hour12(){return D().getHours()%12||12},
 get minute(){return D().getMinutes()},get second(){return D().getSeconds()},
 get ampm(){return D().getHours()<12?0:1},time_format:1,
 get year(){return D().getFullYear()},get month(){return D().getMonth()+1},
 get date(){return D().getDate()},get day_of_week(){return D().getDay()+1},
 year_lunar:'',month_lunar:'',date_lunar:'',battery_level:80,battery_plugged:0,
 screen_width:W,screen_height:H,orientation:0,
 hasweather:0,hasSteps:0,mi_step:null,mi_steps_goal:0,cal_count:0,cd_count:0,city_count:0,todo_count:0,note_count:0};}
const ASSETS=[];
try{window.__DIAL_ASSETS_SPEC=ASSETS;}catch(e){}
const __IMG={};
function IMG(id){const o=__IMG[id];return o&&o.ok?o.im:null;}
(function(){const m=(typeof window!=='undefined'&&window.__DIAL_ASSETS)||{};
 for(const k in m){const im=new Image(),o={im:im,ok:false};__IMG[k]=o;
  const ready=()=>{o.ok=true;};
  im.onload=()=>{ready();if(im.decode)im.decode().then(ready,ready);};
  im.onerror=()=>{o.ok=false;};im.src=m[k];}})();
function paintAssetBg(){for(const a of ASSETS){if(!a||!a.bg)continue;const im=IMG(a.id);if(!im||!im.width)continue;
 const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h);}}
const hits=[];let hover=null,press=null,last=0;
function addHit(a,b,c,d,e){if(a&&typeof a==='object')hits.push({x:a.x,y:a.y,w:a.w,h:a.h,id:b});else hits.push({x:a,y:b,w:c,h:d,id:e});}
function toLogic(e){const r=cv.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;return{x:(px-DX)/FIT,y:(py-DY)/FIT};}
function pick(p){for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h)return h;}return null;}
cv.addEventListener('pointermove',e=>{const h=pick(toLogic(e));hover=h?.id||null;state.hoverBtn=hover;cv.style.cursor=h?'pointer':'default';});
cv.addEventListener('pointerdown',e=>{press=pick(toLogic(e))?.id||null;state.pressBtn=press;});
cv.addEventListener('pointerup',e=>{const h=pick(toLogic(e));if(h&&h.id===press)onTap(h.id);press=null;state.pressBtn=null;});
cv.addEventListener('pointerleave',()=>{hover=null;press=null;state.hoverBtn=null;state.pressBtn=null;cv.style.cursor='default';});

/* 帧率自己节流到 30：背屏常亮，功耗≈帧率×每帧绘制量，帧率是第一乘数。
   只改 manifest 的 frameRate 不够 —— 那是宿主刷新率，rAF 回调可能照旧每秒 60 次，
   JS 计算和 canvas 绘制都省不下来，所以在这里判时间差。
   不可见时直接跳过整帧绘制（列表页/息屏时没必要画）。 */
const FRAME_MS = 1000 / 30;
let lastDraw = 0;
function frame(ms){
  if(document.hidden){ last = ms; requestAnimationFrame(frame); return; }
  /* 纪元回退兜底：AOD 回来后 rAF 时间戳可能从 0 重算，而下面这个变量还是旧纪元的大数，差值恒为负、判据恒成立，frame() 会一直在这里 return，画面冻结时长≈息屏前已运行时长。 */if (ms < lastDraw) lastDraw = ms; if(ms - lastDraw < FRAME_MS){ requestAnimationFrame(frame); return; }
  const t=ms/1000,dt=last?Math.min((ms-last)/1000,0.05):0;last=ms;lastDraw=ms;
  update(dt,t);hits.length=0;
  window.__DIAL_PHASE='bg';paintAssetBg();paintBg(t);
  /* paintAssetBg/paintBg 铺满整屏、不参与变换；shapes/text 是内容层，统一走一组矩阵 */ctx.save();ctx.translate(DX,DY);ctx.scale(FIT,FIT);window.__DIAL_PHASE='shapes';paintShapes(t);
  window.__DIAL_PHASE='text';paintText(t);ctx.restore();
  window.__DIAL_PHASE='idle';requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
